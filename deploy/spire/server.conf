server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "iap.local"
    data_dir = "/run/spire/data"
    log_level = "INFO"

    # CA settings: SPIRE issues its own intermediate CA under this trust
    # domain and signs workload SVIDs with it. In production you'd likely
    # configure an upstream authority (e.g. Vault's PKI engine itself, or
    # an external CA) instead of the default self-signed SPIRE CA — see
    # https://spiffe.io/docs/latest/planning/upstream_ca/
    ca_subject {
        country = ["US"]
        organization = ["Zero-Trust IAP Demo"]
        common_name = "IAP SPIRE CA"
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/data/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/data/keys.json"
        }
    }
}

# Registration entries (which workload gets which SPIFFE ID) are created
# out-of-band via `spire-server entry create`, not in this file — see
# deploy/README.md for the exact commands used to register the IAP proxy
# itself and a couple of demo workloads.
