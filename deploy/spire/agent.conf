agent {
    data_dir = "/run/spire/data"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    trust_domain = "iap.local"
    socket_path = "/run/spire/sockets/agent.sock"

    # In this demo, the agent trusts the server's bootstrap bundle baked
    # in at join time via a join token (see NodeAttestor below). In
    # production, prefer a stronger node attestation method tied to your
    # actual infra (AWS IID, k8s PSAT, TPM, etc) — join_token is the
    # SPIRE equivalent of a training-wheels setup, fine for a portfolio
    # demo, not for a real fleet.
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}

# Workloads (including the IAP proxy container itself) fetch their SVID
# from this agent over the Workload API at the socket_path above, using
# the go-spiffe SDK's workloadapi.X509Source in a real integration. This
# project's internal/identity package implements the *verification* side
# of that contract (see internal/identity/spiffe.go) so it's a drop-in
# swap once you wire an actual Workload API client into cmd/proxy/main.go
# in place of the static/Vault-issued cert path.
